<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>标签页录制器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo"></span>
    <b>标签页录制器</b>
    <span id="stateChip" class="chip idle">空闲</span>
  </header>

  <!-- 待机：开始录制 -->
  <section id="idleBox">
    <div class="modeRow">
      <button class="modeBtn active" id="modeSingle" title="录制为一个完整文件">单段录制</button>
      <button class="modeBtn" id="modeSegment" title="连播课程自动按课时分节保存">自动分节（连播课程）</button>
    </div>

    <div id="courseRow" class="row hidden">
      <label>课程名（用于文件名前缀）</label>
      <input id="courseFolder" type="text" placeholder="留空 = 自动命名">
      <label style="margin-top:6px;"><input type="checkbox" id="autoNext" checked> 播完自动播放下一节（自动点击「下一节」或列表下一项）</label>
      <label style="margin-top:6px;"><input type="checkbox" id="segUrlMode"> 网址一变就切下一节（B 站多 P 等同页换集的网站勾选；不勾 = 按页面课时名智能切节）</label>
    </div>

    <div id="fileRow" class="row hidden">
      <label>录制文件名（可选）</label>
      <input id="fileNameInput" type="text" placeholder="留空 = 自动命名（识别标题或时间戳）">
    </div>

    <div class="row">
      <label>录制区域</label>
      <div class="chips">
        <span id="cropLabel" class="cropLabel">全画面</span>
        <button class="chipBtn" id="cropPickBtn">框选区域…</button>
        <button class="chipBtn hidden" id="cropClearBtn">清除</button>
      </div>
    </div>

    <div class="row">
      <label>定时停止</label>
      <div class="chips" id="presetChips">
        <button class="chipBtn active" data-mode="off">不限</button>
        <button class="chipBtn" data-mode="custom">自定义</button>
      </div>
      <input id="presetTime" type="text" class="hidden" placeholder="00:00:00（时:分:秒）" style="margin-top:6px;">
    </div>

    <div id="wrapRow" class="row hidden">
      <label>无播放自动收工（秒，0 = 不自动收工）</label>
      <input id="silenceWrap" type="number" min="0" max="600" step="1" value="60">
    </div>

    <div class="row">
      <label>延时开始（秒，0 = 立即开始）</label>
      <input id="startDelay" type="number" min="0" max="60" step="1" value="0">
    </div>
    <div class="hint" id="fmtHint"></div>
    <button id="startBtn" class="primary">开始录制当前标签页</button>
    <div class="tip">文件保存到浏览器<b>下载目录</b>，以播放标题自动命名。录制只含本标签页画面与声音；录制中请勿最小化本窗口。</div>
  </section>

  <!-- 录制中 -->
  <section id="recBox" class="hidden">
    <div class="statMain">
      <div class="lesson" id="curLesson">…</div>
      <div class="meta"><span id="curSeq"></span></div>
    </div>
    <div class="tip small" id="detTitle"></div>
    <div class="grid">
      <div><i>已保存</i><b id="segCount">0 节</b></div>
      <div><i>总时长</i><b id="totalTime">00:00</b></div>
      <div><i>已录大小</i><b id="totalSize">0 MB</b></div>
      <div><i>本节时长</i><b id="segTime">00:00</b></div>
    </div>
    <div class="btnRow">
      <button id="pauseBtn">暂停</button>
      <button id="stopBtn" class="danger">停止并保存</button>
    </div>
    <div class="tip small" id="recTip"></div>
  </section>

  <footer><span id="lastResult"></span></footer>

  <script src="popup.js"></script>
</body>
</html>
