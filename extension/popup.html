<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>标签页录制器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo"></span>
    <b>标签页录制器</b>
    <span id="stateChip" class="chip idle">空闲</span>
  </header>

  <!-- 待机：开始录制 -->
  <section id="idleBox">
    <div class="row">
      <label>延时开始（秒，0 = 立即开始）</label>
      <input id="startDelay" type="number" min="0" max="60" step="1" value="0">
    </div>
    <div class="hint" id="fmtHint"></div>
    <button id="startBtn" class="primary">开始录制当前标签页</button>
    <div class="tip">文件保存到浏览器<b>下载目录</b>，以播放标题自动命名。录制只含本标签页画面与声音；录制中请勿最小化本窗口。</div>
  </section>

  <!-- 录制中 -->
  <section id="recBox" class="hidden">
    <div class="statMain">
      <div class="lesson" id="curLesson">…</div>
      <div class="meta"><span id="segTime"></span></div>
    </div>
    <div class="tip small" id="detTitle"></div>
    <div class="grid">
      <div><i>已录大小</i><b id="totalSize">0 MB</b></div>
      <div><i>录制时长</i><b id="totalTime">00:00</b></div>
    </div>
    <div class="btnRow">
      <button id="pauseBtn">暂停</button>
      <button id="stopBtn" class="danger">停止并保存</button>
    </div>
    <div class="tip small" id="recTip"></div>
  </section>

  <footer><span id="lastResult"></span></footer>

  <script src="popup.js"></script>
</body>
</html>
